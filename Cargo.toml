[package]
name = "dreamer"
version = "0.1.0"
edition = "2024"
publish = false
description = "Evidence-backed knowledge for coding agents"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
rusqlite = "0.32"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"

[features]
default = ["bundled-sqlite"]
bundled-sqlite = ["rusqlite/bundled"]

[dev-dependencies]
tempfile = "3.27"

[profile.release]
lto = "thin"
strip = true
