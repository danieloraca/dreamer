[package]
name = "dreamer"
version = "0.1.0"
edition = "2024"
publish = false
description = "Evidence-backed knowledge for coding agents"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
clap = { version = "4.6", features = ["derive"] }
rusqlite = "0.32"
rmcp = { version = "3.8", default-features = false, features = ["server", "transport-io", "schemars", "transport-streamable-http-server"] }
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "sync", "signal"] }
tokio-util = "0.7"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["limit"] }
subtle = "2.6"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
sha2 = "0.10"
url = "2.5"

reqwest = { version = "0.13", default-features = false, features = ["json"], optional = true }

[features]
mac-client = ["dep:reqwest", "rmcp/client", "rmcp/transport-streamable-http-client-reqwest"]
default = ["bundled-sqlite"]
bundled-sqlite = ["rusqlite/bundled"]

[dev-dependencies]
tempfile = "3.27"
rmcp = { version = "3.8", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
tokio = { version = "1.52", features = ["process", "time"] }

[profile.release]
lto = "thin"
strip = true
