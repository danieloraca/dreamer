# Copy to dreamer.toml. This file contains no credentials.
# Relative paths resolve against the directory containing this config file.
data_dir = "data"

[github]
# Currently the local knowledge repository scope; no GitHub access is performed.
# This section is retained for config compatibility. Collection will run on Mac;
# the future Pi service must not require GitHub credentials.
repository = "geckolabs/Gecko-API"
repositories = ["geckolabs/Gecko-API"]
# Add further exact repository names to the list above; always include the default.
# repositories = ["geckolabs/Gecko-API", "geckolabs/Gecko-Micro-Apps"]
batch_size = 25

[memory]
default_search_limit = 5

[http]
# Local foreground default. deploy/dreamer.toml supplies the Pi LAN/Tailscale setup.
listen = "127.0.0.1:3445"
allowed_hosts = ["localhost", "127.0.0.1", "[::1]"]
